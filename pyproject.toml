[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pdlbench"
version = "1.0.0"
description = "Experiment runner, analysis and plotting tools for pdl-bench (Parallel & Distributed Deep Learning Benchmark)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "matplotlib>=3.5",
    "pyyaml>=5.4",
]

[project.optional-dependencies]
metrics = ["lizard>=1.17"]
latex = ["jinja2>=3.0"]

[project.scripts]
pdlbench = "pdlbench.__main__:main"

[tool.setuptools]
package-dir = { "" = "pytools" }

[tool.setuptools.packages.find]
where = ["pytools"]

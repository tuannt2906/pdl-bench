# GEMM implementation comparison (the kernel behind im2col convolution and FC layers).
# Expected runtime: ~10 minutes (naive kernels are skipped above --max-naive).
name: compute_gemm
description: >
  GFLOP/s of every GEMM implementation (CPU naive/blocked/OpenMP, CUDA naive/tiled/cuBLAS)
  for square matrices 64..4096.
binary: pdl_bench_compute
repeats: 3
timeout: 3600
env:
  OMP_NUM_THREADS: 12
  OMP_PROC_BIND: close
  OMP_PLACES: cores
base_args:
  op: gemm
  sizes: "64,128,256,512,1024,2048,4096"
  impls: all
  max-naive: 1024
  reps: 5
  warmup: 2
analysis:
  group_by: [op, impl]
  plots: [gemm]
